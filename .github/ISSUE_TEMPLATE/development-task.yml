name: 开发任务
description: 为开发 Agent 分配一个范围清晰、可以验收的任务
title: "[任务] "
body:
  - type: textarea
    id: objective
    attributes:
      label: 目标与背景
      description: 说明要解决的问题，并关联 docs/tasks.md 中的任务编号。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 修改范围
      description: 写明负责模块、允许修改的范围和需要协调的共享文件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可检查的条件，包含必要的失败情况。
      placeholder: "- [ ] 条件一\n- [ ] 条件二"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与负责人
      description: 相关 Issue、接口、资料、负责人及独立开发目录。
  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 说明需要执行的检查，以及是否需要真实模型或外部服务。
    validations:
      required: true
