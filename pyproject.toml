[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "printcare-ai"
description = "基于 RAG 的桌面 FDM 3D 打印机售后问答助手"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
# 开发检查工具使用精确版本，便于在干净环境复现；运行时依赖由对应任务追加并同样锁定版本。
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "printcare.__version__" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["printcare"]
